name: Windows spawn diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  spawn:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify package-bin spawning
        run: >-
          pnpm exec bun test
          packages/0-framework/3-tooling/cli/src/family/__tests__/runtime.test.ts
          packages/0-framework/3-tooling/cli/src/__tests__/run-alchemy.test.ts
