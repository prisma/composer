name: Diagnose Windows create-prisma deploy

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/diagnose-windows-engine'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
      PRISMA_WORKSPACE_ID: ${{ vars.PRISMA_WORKSPACE_ID }}
      PRISMA_REGION: us-east-1
      APP_NAME: diagnose-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Scaffold app with the current Composer 0.25 pins
        shell: pwsh
        run: npx --yes create-prisma@pr121 $env:APP_NAME --template minimal --provider postgres --authoring psl --package-manager npm --skills none --no-deploy --json
      - name: Build and pack Composer from this PR
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@prisma/composer-prisma-cloud...
          pnpm --filter @prisma/composer-prisma-cloud pack --pack-destination $env:RUNNER_TEMP
      - name: Install the patched package
        shell: pwsh
        working-directory: ${{ env.APP_NAME }}
        run: npm install --no-save --no-audit "$env:RUNNER_TEMP/prisma-composer-prisma-cloud-0.25.0.tgz"
      - name: Build app
        shell: pwsh
        working-directory: ${{ env.APP_NAME }}
        run: npm run build
      - name: Deploy
        shell: pwsh
        working-directory: ${{ env.APP_NAME }}
        run: npm run composer:deploy -- --log-level verbose
      - name: Remove diagnostic project
        if: always()
        shell: pwsh
        run: bun scripts/ci-cleanup.ts diagnose
