name: Windows npm assembly diagnostic
on:
  pull_request:
    paths: ['.github/workflows/windows-npm-assembly-diagnostic.yml', '.github/scripts/assemble-current-cli.mjs']
permissions:
  contents: read
jobs:
  assemble:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: '1'
      CREATE_PRISMA_DISABLE_TELEMETRY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Record toolchains and install the supported npm minimum
        run: |
          node --version
          npm --version
          Get-Command node,npm,npx | Format-Table Name,Source
          Set-Location $env:RUNNER_TEMP
          node --version
          npm --version
          Get-Command node,npm,npx | Format-Table Name,Source
          npm install --global npm@11.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = npm prefix --global
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Scaffold published preview with npm 11.6.0
        working-directory: ${{ runner.temp }}
        run: |
          node --version
          $npmVersion = npm --version
          Write-Output "npm $npmVersion"
          if ($npmVersion -ne '11.6.0') { throw 'The test must use npm 11.6.0' }
          npx --yes create-prisma@0.12.0-pr.99.335.1 windows-supported-npm --json --no-deploy --template next --authoring typescript --package-manager npm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run build --filter=@prisma/composer...
      - name: Pack Composer PR
        working-directory: packages/9-public/composer
        run: npm pack --ignore-scripts
      - name: Build and assemble the actual scaffold
        run: |
          Set-Location "$env:RUNNER_TEMP/windows-supported-npm"
          npm install "$env:GITHUB_WORKSPACE/packages/9-public/composer/prisma-composer-0.20.0.tgz" @prisma/composer-prisma-cloud@0.20.0 @prisma/orm-postgres@8.0.0-rc.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:GITHUB_WORKSPACE/.github/scripts/assemble-current-cli.mjs"
