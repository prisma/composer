name: Windows current CLI diagnostic
on:
  pull_request:
    paths: ['.github/workflows/windows-current-cli-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: e2e-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: '1'
      CREATE_PRISMA_DISABLE_TELEMETRY: '1'
      PRISMA_REGION: us-east-1
      APP_NAME: windows-next-${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run build --filter=@prisma/composer...
      - name: Scaffold published CLI with npm
        run: npx --yes create-prisma@0.12.0 $env:APP_NAME --json --no-deploy --template next --authoring typescript --package-manager npm
      - name: Pack Composer PR
        working-directory: packages/9-public/composer
        run: npm pack --ignore-scripts
      - name: Install Composer PR and build
        run: |
          Set-Location $env:APP_NAME
          npm install ../packages/9-public/composer/prisma-composer-0.20.0.tgz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Deploy and verify seeded page
        id: deploy
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_WORKSPACE_ID: ${{ vars.PRISMA_WORKSPACE_ID }}
        run: |
          Set-Location $env:APP_NAME
          $lines = npm exec --offline --yes=false -- prisma deploy module.ts --json
          $lines
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $frames = $lines | ForEach-Object { $_ | ConvertFrom-Json }
          $result = $frames | Where-Object kind -eq 'result' | Select-Object -Last 1
          if (-not $result.envelope.ok) { throw 'Deploy did not return success' }
          $url = $result.envelope.result.summary.nodes.entities | Where-Object kind -eq 'compute-service' | Select-Object -ExpandProperty url -First 1
          if (-not $url) { throw 'No public service URL returned' }
          $response = Invoke-WebRequest -Uri $url -TimeoutSec 60
          if ($response.StatusCode -ne 200 -or $response.Content -notmatch 'alice@prisma.io') { throw 'Deployed page did not return seeded data' }
          Write-Output "HTTP $($response.StatusCode): deployed Next.js page contains seeded database data"
      - name: Remove this diagnostic project
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_WORKSPACE_ID: ${{ vars.PRISMA_WORKSPACE_ID }}
        run: |
          Set-Location $env:APP_NAME
          $lines = npm exec --offline --yes=false -- prisma project show $env:APP_NAME --json
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve diagnostic project for cleanup' }
          $result = $lines | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object kind -eq 'result' | Select-Object -Last 1
          $project = $result.envelope.result.project
          if (-not $project.id -or $project.name -ne $env:APP_NAME) { throw 'Refusing to delete an unexpected project' }
          npm exec --offline --yes=false -- prisma project delete $project.id --confirm $project.id --json
