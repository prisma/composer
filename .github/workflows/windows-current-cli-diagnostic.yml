name: Windows current CLI diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DO_NOT_TRACK: '1'
  CREATE_PRISMA_DISABLE_TELEMETRY: '1'
  PRISMA_TELEMETRY_DISABLED: '1'
jobs:
  isolate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.16.0'
      - name: Reproduce native Bun subprocess resolution
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          npm install --global bun@1.4.1 pnpm@11.21.0
          node --version
          bun --version
          where.exe bun
          node -e "const p=require('node:child_process').spawnSync('bun',['--version'],{encoding:'utf8'});console.log({status:p.status,error:p.error?.message,stdout:p.stdout})"
          $globalRoot = npm root --global
          $binary = Get-ChildItem (Join-Path $globalRoot 'bun') -Filter bun.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Native Bun executable not found in its npm package' }
          $env:PATH = "$($binary.DirectoryName);$env:PATH"
          node -e "const p=require('node:child_process').spawnSync('bun',['--version'],{encoding:'utf8'});console.log({status:p.status,error:p.error?.message,stdout:p.stdout})"
      - name: Inspect failing pnpm dependency tree and config import
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git config --global user.name 'Prisma diagnostic'
          git config --global user.email 'diagnostic@prisma.io'
          pnpm dlx create-prisma@0.12.1 cp0121-inspect --template hono --provider postgres --authoring psl --package-manager pnpm --no-deploy --yes --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location cp0121-inspect
          Get-Content pnpm-workspace.yaml
          pnpm why @effect/platform-node-shared
          node -e "const fs=require('node:fs'),path=require('node:path');for(const d of fs.readdirSync('node_modules/.pnpm').filter(x=>x.startsWith('@effect+platform-node')||x.startsWith('effect@'))){console.log(d);const p=path.join('node_modules/.pnpm',d,'node_modules/effect');try{console.log({real:fs.realpathSync(p),version:JSON.parse(fs.readFileSync(path.join(p,'package.json'),'utf8')).version,hasByteSize:fs.existsSync(path.join(p,'dist/ByteSize.js'))})}catch(e){console.log(e.message)}}"
          node --input-type=module -e "try{await import('./prisma-composer.config.ts');console.log('Native config import succeeded')}catch(e){console.error(e)}"
          node --input-type=module -e "import{createRequire}from'node:module';import{pathToFileURL}from'node:url';import path from'node:path';const r=createRequire(import.meta.resolve('@prisma/composer/control'));try{const{loadConfig}=await import(pathToFileURL(r.resolve('c12')).href);await loadConfig({name:'prisma-composer',configFile:path.resolve('prisma-composer.config.ts'),cwd:process.cwd(),rcFile:false,globalRc:false,packageJson:false});console.log('Composer config evaluation succeeded')}catch(e){console.error(e)}"
