packages:
  - packages/**
  - examples/*
  - examples/*/modules/*
  - test/**
  - website

# Dependabot runs `pnpm update` with a minimum release age (its cooldown), and
# pnpm applies that age to every package it resolves, not only the one being
# updated. These are pinned by hand to an exact, often recent, release, so a
# young pin would fail every Dependabot update until it aged.
minimumReleaseAgeExclude:
  - alchemy
  - '@alchemy.run/*'
  - '@distilled.cloud/*'
  - effect
  - '@effect/*'
  - prisma
  - '@prisma/*'
  - '@durable-streams/server-conformance-tests'

# The published prisma host every example, website and test/integration run.
# One pin, so a host bump is one line; scripts/check-cli-engine-pin.mjs checks
# that every manifest uses it and that the host shares the workspace engine.
# Delete the root package.json override prisma>@prisma/orm-toolchain when this
# pin moves to a release built on the workspace's ORM version.
catalog:
  prisma: 8.0.0-rc.34
  # alchemy and every @alchemy.run/* package move together, at one release;
  # @distilled.cloud/prisma is the exact version @alchemy.run/prisma depends
  # on. See the upgrade-alchemy-effect skill.
  alchemy: 2.0.0-beta.87
  '@alchemy.run/prisma': 2.0.0-beta.87
  '@distilled.cloud/prisma': 1.0.0-rc.20
  effect: 4.1.4
  '@effect/platform-bun': 4.1.4
  '@effect/platform-node': 4.1.4
  '@effect/platform-node-shared': 4.1.4
