packages:
  - packages/**
  - examples/*
  - examples/*/modules/*
  - test/**
  - website

# The published prisma host every example, website and test/integration run.
# One pin, so a host bump is one line; scripts/check-cli-engine-pin.mjs checks
# that every manifest uses it and that the host shares the workspace engine.
catalog:
  prisma: 8.0.0-rc.26
  # alchemy and every @alchemy.run/* package move together, at one commit or
  # one release; @distilled.cloud/prisma is the exact version
  # @alchemy.run/prisma depends on. See the upgrade-alchemy-effect skill.
  alchemy: https://pkg.alchemy.run/alchemy/pr:3101:ab55f95
  '@alchemy.run/prisma': https://pkg.alchemy.run/@alchemy.run/prisma/pr:3101:ab55f95
  '@distilled.cloud/prisma': https://pkg.alchemy.run/@distilled.cloud/prisma/-/9af912743056174c99bfc63a4702e5c09d6e5d718057b81e8964ffde4f87408b.tgz
  effect: 4.1.2
  '@effect/platform-bun': 4.1.2
  '@effect/platform-node': 4.1.2
  '@effect/platform-node-shared': 4.1.2
